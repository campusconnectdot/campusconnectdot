<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alumni • Student Guidance Portal</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: #f6f8fa;
            color: #24292f;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */

        .topbar {
            height: 64px;
            background: #ffffff;
            border-bottom: 1px solid #d8dee4;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-btn {
            width: 36px;
            height: 36px;

            border: 1px solid #d0d7de;
            background: #ffffff;
            border-radius: 6px;

            cursor: pointer;
            font-size: 18px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            background: #f6f8fa;
        }

        .page-title {
            font-size: 17px;
            font-weight: 600;
            color: #24292f;
        }

        .page-subtitle {
            font-size: 12px;
            color: #57606a;
            margin-top: 2px;
        }

        /* Profile icon */

        .profile-button {
            width: 36px;
            height: 36px;

            border-radius: 50%;
            border: 1px solid #d0d7de;

            background: #f6f8fa;

            cursor: pointer;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-button img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-letter {
            font-size: 14px;
            font-weight: 600;
            color: #24292f;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            width: 100%;
            max-width: 1050px;

            margin: 0 auto;
            padding: 38px 24px 60px;
        }

        .heading-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;

            gap: 20px;

            margin-bottom: 22px;
        }

        .heading h1 {
            font-size: 25px;
            font-weight: 600;
            color: #24292f;
            margin-bottom: 5px;
        }

        .heading p {
            color: #57606a;
            font-size: 14px;
        }

        /* Search */

        .search-box {
            width: 280px;

            border: 1px solid #d0d7de;
            background: #ffffff;
            border-radius: 6px;

            height: 38px;

            display: flex;
            align-items: center;

            padding: 0 11px;
        }

        .search-box span {
            color: #57606a;
            margin-right: 8px;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            color: #24292f;
        }

        /* =========================
           ALUMNI LIST
        ========================= */

        .alumni-container {
            background: #ffffff;

            border: 1px solid #d8dee4;
            border-radius: 8px;

            overflow: hidden;
        }

        .list-header {
            display: grid;
            grid-template-columns: 2fr 1.2fr 1.2fr 120px;

            padding: 13px 18px;

            background: #f6f8fa;

            border-bottom: 1px solid #d8dee4;

            font-size: 12px;
            font-weight: 600;

            color: #57606a;
        }

        .alumni-row {
            display: grid;
            grid-template-columns: 2fr 1.2fr 1.2fr 120px;

            align-items: center;

            min-height: 72px;

            padding: 10px 18px;

            border-bottom: 1px solid #eaeef2;

            transition: background 0.15s ease;
        }

        .alumni-row:last-child {
            border-bottom: none;
        }

        .alumni-row:hover {
            background: #f6f8fa;
        }

        .person {
            display: flex;
            align-items: center;
            gap: 12px;

            min-width: 0;
        }

        .avatar {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #eaeef2;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;
            font-weight: 600;
            color: #57606a;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .person-info {
            min-width: 0;
        }

        .person-name {
            font-size: 14px;
            font-weight: 600;
            color: #24292f;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .person-email {
            font-size: 12px;
            color: #57606a;

            margin-top: 3px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .degree,
        .department {
            font-size: 13px;
            color: #57606a;
        }

        .view-btn {
            border: 1px solid #d0d7de;

            background: #ffffff;

            color: #0969da;

            border-radius: 6px;

            padding: 6px 11px;

            font-size: 12px;
            font-weight: 500;

            cursor: pointer;
        }

        .view-btn:hover {
            background: #f6f8fa;
            border-color: #0969da;
        }

        /* Empty */

        .empty {
            padding: 50px 20px;
            text-align: center;
            color: #57606a;
            font-size: 14px;
        }

        .loading {
            padding: 50px 20px;
            text-align: center;
            color: #57606a;
            font-size: 14px;
        }

        /* =========================
           PROFILE PREVIEW
        ========================= */

        .preview-overlay {
            position: fixed;

            inset: 0;

            background: rgba(27, 31, 36, 0.35);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 100;
        }

        .preview-overlay.active {
            display: flex;
        }

        .preview-box {
            width: 100%;
            max-width: 600px;

            max-height: 90vh;
            overflow-y: auto;

            background: #ffffff;

            border: 1px solid #d8dee4;

            border-radius: 8px;

            box-shadow:
                0 8px 24px rgba(140, 149, 159, 0.25);

            animation: popup 0.16s ease;
        }

        @keyframes popup {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 16px 20px;

            border-bottom: 1px solid #d8dee4;
        }

        .preview-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .preview-back {
            border: none;
            background: transparent;

            font-size: 20px;

            cursor: pointer;

            color: #57606a;
        }

        .preview-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .close-btn {
            width: 30px;
            height: 30px;

            border: none;
            background: transparent;

            border-radius: 6px;

            cursor: pointer;

            font-size: 20px;
            color: #57606a;
        }

        .close-btn:hover {
            background: #f6f8fa;
        }

        .preview-content {
            padding: 26px;
        }

        .profile-top {
            display: flex;
            align-items: center;

            gap: 16px;

            margin-bottom: 25px;
        }

        .large-avatar {
            width: 70px;
            height: 70px;

            flex-shrink: 0;

            border-radius: 50%;

            overflow: hidden;

            background: #eaeef2;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
            font-weight: 600;
            color: #57606a;
        }

        .large-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-top h3 {
            font-size: 20px;
            font-weight: 600;

            color: #24292f;

            margin-bottom: 4px;
        }

        .profile-top p {
            font-size: 13px;
            color: #57606a;
        }

        .profile-section {
            margin-top: 20px;
        }

        .profile-section h4 {
            font-size: 12px;
            text-transform: uppercase;

            letter-spacing: 0.04em;

            color: #57606a;

            margin-bottom: 8px;
        }

        .profile-value {
            font-size: 14px;
            line-height: 1.6;

            color: #24292f;
        }

        .profile-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;

            margin-top: 20px;
        }

        .profile-item {
            border: 1px solid #eaeef2;

            border-radius: 6px;

            padding: 12px;

            background: #f6f8fa;
        }

        .profile-item span {
            display: block;

            font-size: 11px;

            color: #57606a;

            margin-bottom: 4px;
        }

        .profile-item strong {
            font-size: 13px;

            font-weight: 500;

            color: #24292f;
        }

        .preview-footer {
            display: flex;

            justify-content: flex-end;

            gap: 8px;

            padding: 16px 20px;

            border-top: 1px solid #d8dee4;
        }

        .contact-btn {
            background: #24292f;

            color: #ffffff;

            border: 1px solid #24292f;

            border-radius: 6px;

            padding: 8px 16px;

            font-size: 13px;

            cursor: pointer;
        }

        .contact-btn:hover {
            background: #32383f;
        }

        .secondary-btn {
            background: #ffffff;

            color: #24292f;

            border: 1px solid #d0d7de;

            border-radius: 6px;

            padding: 8px 16px;

            font-size: 13px;

            cursor: pointer;
        }

        .secondary-btn:hover {
            background: #f6f8fa;
        }

        /* =========================
           CONTACT POPUP
        ========================= */

        .contact-overlay {
            position: fixed;

            inset: 0;

            background: rgba(27, 31, 36, 0.4);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 200;
        }

        .contact-overlay.active {
            display: flex;
        }

        .contact-box {
            width: 100%;
            max-width: 450px;

            background: #ffffff;

            border: 1px solid #d8dee4;

            border-radius: 8px;

            box-shadow: 0 8px 24px rgba(140, 149, 159, 0.3);
        }

        .contact-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            padding: 16px 20px;

            border-bottom: 1px solid #d8dee4;
        }

        .contact-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .contact-body {
            padding: 20px;
        }

        .contact-body label {
            display: block;

            font-size: 12px;

            font-weight: 500;

            color: #57606a;

            margin-bottom: 6px;
        }

        .contact-body input,
        .contact-body textarea {
            width: 100%;

            border: 1px solid #d0d7de;

            border-radius: 6px;

            padding: 9px 10px;

            font-size: 13px;

            outline: none;

            margin-bottom: 15px;

            background: #ffffff;

            color: #24292f;
        }

        .contact-body input:focus,
        .contact-body textarea:focus {
            border-color: #0969da;

            box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.1);
        }

        .contact-body textarea {
            min-height: 120px;

            resize: vertical;
        }

        .contact-footer {
            display: flex;

            justify-content: flex-end;

            gap: 8px;

            padding: 15px 20px;

            border-top: 1px solid #d8dee4;
        }

        .send-btn {
            background: #0969da;

            color: #ffffff;

            border: 1px solid #0969da;

            border-radius: 6px;

            padding: 8px 16px;

            cursor: pointer;

            font-size: 13px;
        }

        .send-btn:hover {
            background: #0757b5;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .topbar {
                padding: 0 16px;
            }

            .main {
                padding: 25px 14px 40px;
            }

            .heading-row {
                align-items: stretch;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .list-header {
                display: none;
            }

            .alumni-row {
                grid-template-columns: 1fr auto;

                gap: 12px;

                padding: 14px;
            }

            .degree,
            .department {
                display: none;
            }

            .view-btn {
                grid-column: 2;
                grid-row: 1;
            }

            .person {
                grid-column: 1;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }

            .preview-content {
                padding: 20px;
            }

            .preview-footer {
                flex-direction: column-reverse;
            }

            .preview-footer button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header class="topbar">

        <div class="topbar-left">

            <button
                class="back-btn"
                onclick="goDashboard()"
                title="Back to dashboard"
            >
                ←
            </button>

            <div>
                <div class="page-title">Alumni</div>
                <div class="page-subtitle">
                    Connect with experienced alumni
                </div>
            </div>

        </div>

        <button
            class="profile-button"
            onclick="goProfile()"
            id="headerProfileButton"
            title="My profile"
        >
            <span class="profile-letter" id="headerProfileLetter">
                ?
            </span>
        </button>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

        <div class="heading-row">

            <div class="heading">

                <h1>Alumni</h1>

                <p>
                    Explore alumni profiles and connect with them.
                </p>

            </div>

            <div class="search-box">

                <span>⌕</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search alumni..."
                    oninput="filterAlumni()"
                >

            </div>

        </div>


        <!-- Alumni list -->

        <section class="alumni-container">

            <div class="list-header">

                <div>Alumni</div>

                <div>Degree</div>

                <div>Department</div>

                <div></div>

            </div>

            <div id="alumniList">

                <div class="loading">
                    Loading alumni...
                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         PROFILE PREVIEW
    ========================= -->

    <div
        class="preview-overlay"
        id="previewOverlay"
        onclick="closePreviewFromBackground(event)"
    >

        <div class="preview-box">

            <div class="preview-header">

                <div class="preview-header-left">

                    <button
                        class="preview-back"
                        onclick="closePreview()"
                    >
                        ←
                    </button>

                    <h2>Profile</h2>

                </div>

                <button
                    class="close-btn"
                    onclick="closePreview()"
                >
                    ×
                </button>

            </div>


            <div
                class="preview-content"
                id="previewContent"
            >
            </div>


            <div class="preview-footer">

                <button
                    class="secondary-btn"
                    onclick="closePreview()"
                >
                    Back
                </button>

                <button
                    class="contact-btn"
                    onclick="openContact()"
                >
                    Contact
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         CONTACT POPUP
    ========================= -->

    <div
        class="contact-overlay"
        id="contactOverlay"
        onclick="closeContactFromBackground(event)"
    >

        <div class="contact-box">

            <div class="contact-header">

                <h3>
                    Contact <span id="contactName">Alumni</span>
                </h3>

                <button
                    class="close-btn"
                    onclick="closeContact()"
                >
                    ×
                </button>

            </div>


            <div class="contact-body">

                <label for="contactSubject">
                    Subject
                </label>

                <input
                    type="text"
                    id="contactSubject"
                    placeholder="What would you like to discuss?"
                >


                <label for="contactMessage">
                    Message
                </label>

                <textarea
                    id="contactMessage"
                    placeholder="Write your message..."
                ></textarea>

            </div>


            <div class="contact-footer">

                <button
                    class="secondary-btn"
                    onclick="closeContact()"
                >
                    Cancel
                </button>

                <button
                    class="send-btn"
                    onclick="sendContactMessage()"
                >
                    Send Message
                </button>

            </div>

        </div>

    </div>


    <script>

        /* =========================================
           SUPABASE
        ========================================= */

        const SUPABASE_URL =
            'https://kksarduvycfebklmhxfb.supabase.co';

        const SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtrc2FyZHV2eWNmZWJrbG1oeGZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMzU2MjQsImV4cCI6MjEwMTkxMTYyNH0.NlnHnEBqDX_sPJEK1evlYznhyWjTyANMn95QqrVARI0';

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* =========================================
           VARIABLES
        ========================================= */

        let currentUser = null;

        let currentProfile = null;

        let alumniData = [];

        let selectedAlumni = null;


        /* =========================================
           LOAD PAGE
        ========================================= */

        async function loadAlumniPage() {

            try {

                const {
                    data: userData,
                    error: userError
                } = await supabaseClient.auth.getUser();

                currentUser = userData.user;


                /*
                 * User must be logged in.
                 */

                if (userError || !currentUser) {

                    window.location.href = 'index.html';

                    return;
                }


                /*
                 * Load current user's profile.
                 */

                const {
                    data: profile,
                    error: profileError
                } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();


                if (!profileError && profile) {

                    currentProfile = profile;

                    showHeaderProfile(profile);
                }


                /*
                 * Load alumni.
                 *
                 * IMPORTANT:
                 * Current user is excluded.
                 */

                const {
                    data,
                    error
                } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('account_type', 'alumni')
                    .neq('id', currentUser.id)
                    .order('full_name', {
                        ascending: true
                    });


                if (error) {

                    console.error(error);

                    document.getElementById(
                        'alumniList'
                    ).innerHTML = `
                        <div class="empty">
                            Unable to load alumni right now.
                        </div>
                    `;

                    return;
                }


                alumniData = data || [];

                renderAlumni(alumniData);

            }

            catch (error) {

                console.error(error);

                document.getElementById(
                    'alumniList'
                ).innerHTML = `
                    <div class="empty">
                        Something went wrong while loading alumni.
                    </div>
                `;
            }
        }


        /* =========================================
           HEADER PROFILE
        ========================================= */

        function showHeaderProfile(profile) {

            const button =
                document.getElementById(
                    'headerProfileButton'
                );

            const letter =
                document.getElementById(
                    'headerProfileLetter'
                );


            /*
             * These are possible avatar/image fields.
             *
             * If your profile.html saves one of these,
             * it will automatically be displayed.
             */

            const image =
                profile.avatar_url ||
                profile.profile_image ||
                profile.profile_photo ||
                profile.image_url ||
                profile.photo_url;


            if (image) {

                button.innerHTML = `
                    <img
                        src="${escapeHtml(image)}"
                        alt="Profile"
                    >
                `;

            } else {

                const name =
                    profile.full_name ||
                    currentUser.email ||
                    'U';

                letter.textContent =
                    name.charAt(0).toUpperCase();
            }
        }


        /* =========================================
           RENDER ALUMNI
        ========================================= */

        function renderAlumni(list) {

            const container =
                document.getElementById(
                    'alumniList'
                );


            if (!list.length) {

                container.innerHTML = `
                    <div class="empty">
                        No alumni profiles found.
                    </div>
                `;

                return;
            }


            container.innerHTML =
                list.map(alumni => {

                    const name =
                        alumni.full_name ||
                        'Unnamed Alumni';

                    const degree =
                        alumni.degree ||
                        '—';

                    const department =
                        alumni.department ||
                        alumni.field_of_study ||
                        '—';


                    const image =
                        alumni.avatar_url ||
                        alumni.profile_image ||
                        alumni.profile_photo ||
                        alumni.image_url ||
                        alumni.photo_url;


                    let avatarHTML = '';

                    if (image) {

                        avatarHTML = `
                            <img
                                src="${escapeHtml(image)}"
                                alt="${escapeHtml(name)}"
                            >
                        `;

                    } else {

                        avatarHTML =
                            escapeHtml(
                                name.charAt(0).toUpperCase()
                            );
                    }


                    return `

                        <div class="alumni-row">

                            <div class="person">

                                <div class="avatar">
                                    ${avatarHTML}
                                </div>

                                <div class="person-info">

                                    <div class="person-name">
                                        ${escapeHtml(name)}
                                    </div>

                                    <div class="person-email">
                                        ${escapeHtml(
                                            alumni.email ||
                                            ''
                                        )}
                                    </div>

                                </div>

                            </div>


                            <div class="degree">
                                ${escapeHtml(degree)}
                            </div>


                            <div class="department">
                                ${escapeHtml(department)}
                            </div>


                            <div>

                                <button
                                    class="view-btn"
                                    onclick="viewProfile('${alumni.id}')"
                                >
                                    View Profile
                                </button>

                            </div>

                        </div>

                    `;

                }).join('');
        }


        /* =========================================
           SEARCH
        ========================================= */

        function filterAlumni() {

            const query =
                document
                    .getElementById('searchInput')
                    .value
                    .toLowerCase()
                    .trim();


            if (!query) {

                renderAlumni(alumniData);

                return;
            }


            const filtered =
                alumniData.filter(alumni => {

                    const name =
                        alumni.full_name ||
                        '';

                    const degree =
                        alumni.degree ||
                        '';

                    const department =
                        alumni.department ||
                        alumni.field_of_study ||
                        '';

                    const employment =
                        alumni.current_employment ||
                        '';


                    return (
                        name.toLowerCase().includes(query) ||
                        degree.toLowerCase().includes(query) ||
                        department.toLowerCase().includes(query) ||
                        employment.toLowerCase().includes(query)
                    );
                });


            renderAlumni(filtered);
        }


        /* =========================================
           VIEW PROFILE
        ========================================= */

        function viewProfile(id) {

            const alumni =
                alumniData.find(
                    person => person.id === id
                );


            if (!alumni) return;


            selectedAlumni = alumni;


            const name =
                alumni.full_name ||
                'Unnamed Alumni';


            const image =
                alumni.avatar_url ||
                alumni.profile_image ||
                alumni.profile_photo ||
                alumni.image_url ||
                alumni.photo_url;


            let avatarHTML = '';

            if (image) {

                avatarHTML = `
                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(name)}"
                    >
                `;

            } else {

                avatarHTML =
                    escapeHtml(
                        name.charAt(0).toUpperCase()
                    );
            }


            document.getElementById(
                'previewContent'
            ).innerHTML = `

                <div class="profile-top">

                    <div class="large-avatar">
                        ${avatarHTML}
                    </div>

                    <div>

                        <h3>
                            ${escapeHtml(name)}
                        </h3>

                        <p>
                            Alumni
                        </p>

                    </div>

                </div>


                <div class="profile-grid">

                    <div class="profile-item">

                        <span>Email</span>

                        <strong>
                            ${escapeHtml(
                                alumni.email || 'Not provided'
                            )}
                        </strong>

                    </div>


                    <div class="profile-item">

                        <span>Degree</span>

                        <strong>
                            ${escapeHtml(
                                alumni.degree || 'Not provided'
                            )}
                        </strong>

                    </div>


                    <div class="profile-item">

                        <span>Department</span>

                        <strong>
                            ${escapeHtml(
                                alumni.department ||
                                alumni.field_of_study ||
                                'Not provided'
                            )}
                        </strong>

                    </div>


                    <div class="profile-item">

                        <span>Employment</span>

                        <strong>
                            ${escapeHtml(
                                alumni.current_employment ||
                                'Not provided'
                            )}
                        </strong>

                    </div>

                </div>


                <div class="profile-section">

                    <h4>
                        About
                    </h4>

                    <div class="profile-value">
                        ${escapeHtml(
                            alumni.bio ||
                            'No biography has been added yet.'
                        )}
                    </div>

                </div>


                ${
                    alumni.skills
                    ? `

                        <div class="profile-section">

                            <h4>
                                Skills
                            </h4>

                            <div class="profile-value">
                                ${escapeHtml(
                                    alumni.skills
                                )}
                            </div>

                        </div>

                    `
                    : ''
                }


                ${
                    alumni.location
                    ? `

                        <div class="profile-section">

                            <h4>
                                Location
                            </h4>

                            <div class="profile-value">
                                ${escapeHtml(
                                    alumni.location
                                )}
                            </div>

                        </div>

                    `
                    : ''
                }

            `;


            document
                .getElementById('previewOverlay')
                .classList.add('active');

            document.body.style.overflow = 'hidden';
        }


        /* =========================================
           CLOSE PROFILE
        ========================================= */

        function closePreview() {

            document
                .getElementById('previewOverlay')
                .classList.remove('active');

            document.body.style.overflow = '';

            selectedAlumni = null;
        }


        function closePreviewFromBackground(event) {

            if (
                event.target.id ===
                'previewOverlay'
            ) {

                closePreview();
            }
        }


        /* =========================================
           CONTACT
        ========================================= */

        function openContact() {

            if (!selectedAlumni) return;


            document.getElementById(
                'contactName'
            ).textContent =
                selectedAlumni.full_name ||
                'Alumni';


            document.getElementById(
                'contactSubject'
            ).value = '';


            document.getElementById(
                'contactMessage'
            ).value = '';


            document
                .getElementById('contactOverlay')
                .classList.add('active');
        }


        function closeContact() {

            document
                .getElementById('contactOverlay')
                .classList.remove('active');
        }


        function closeContactFromBackground(event) {

            if (
                event.target.id ===
                'contactOverlay'
            ) {

                closeContact();
            }
        }


        /* =========================================
           SEND CONTACT MESSAGE
        ========================================= */

        async function sendContactMessage() {

            const subject =
                document
                    .getElementById(
                        'contactSubject'
                    )
                    .value
                    .trim();


            const message =
                document
                    .getElementById(
                        'contactMessage'
                    )
                    .value
                    .trim();


            if (!subject || !message) {

                alert(
                    'Please enter a subject and message.'
                );

                return;
            }


            if (!selectedAlumni) return;


            /*
             * For now this creates a simple local
             * confirmation.
             *
             * Later we can connect this button to
             * a messages table in Supabase.
             */

            alert(
                'Your message is ready to be sent to ' +
                selectedAlumni.full_name +
                '.'
            );


            closeContact();
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        function goDashboard() {

            window.location.href =
                'dashboard.html';
        }


        function goProfile() {

            window.location.href =
                'profile.html';
        }


        /* =========================================
           SECURITY HELPER
        ========================================= */

        function escapeHtml(value) {

            if (value === null ||
                value === undefined) {

                return '';
            }


            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }


        /* =========================================
           START
        ========================================= */

        loadAlumniPage();

    </script>

</body>
</html>
