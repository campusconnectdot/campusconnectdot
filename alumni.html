<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Alumni • Student Guidance Portal</title>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: #f6f8fa;
            color: #24292f;
            min-height: 100vh;
        }

        .main {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 32px 24px 60px;
        }

        /* BACK BUTTON */

        .main-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            border: 1px solid #d0d7de;
            background: #ffffff;
            color: #24292f;

            border-radius: 6px;

            padding: 7px 11px;

            font-size: 13px;
            font-weight: 500;

            cursor: pointer;

            margin-bottom: 26px;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .main-back-btn:hover {
            background: #f6f8fa;
            border-color: #8c959f;
        }

        .main-back-btn .arrow {
            font-size: 16px;
            line-height: 1;
        }

        /* HEADING */

        .heading-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 22px;
        }

        .heading h1 {
            font-size: 25px;
            font-weight: 600;
            color: #24292f;
            margin-bottom: 5px;
        }

        .heading p {
            color: #57606a;
            font-size: 14px;
        }

        /* SEARCH */

        .search-box {
            width: 280px;

            border: 1px solid #d0d7de;
            background: #ffffff;
            border-radius: 6px;

            height: 38px;

            display: flex;
            align-items: center;

            padding: 0 11px;
        }

        .search-box span {
            color: #57606a;
            margin-right: 8px;
            font-size: 17px;
        }

        .search-box input {
            width: 100%;

            border: none;
            outline: none;

            font-size: 14px;

            background: transparent;
            color: #24292f;
        }

        .search-box input::placeholder {
            color: #8c959f;
        }

        /* ALUMNI LIST */

        .alumni-container {
            background: #ffffff;

            border: 1px solid #d8dee4;
            border-radius: 8px;

            overflow: hidden;
        }

        .list-header {
            display: grid;
            grid-template-columns: 2fr 1.2fr 1.2fr 120px;

            padding: 13px 18px;

            background: #f6f8fa;

            border-bottom: 1px solid #d8dee4;

            font-size: 12px;
            font-weight: 600;

            color: #57606a;
        }

        .alumni-row {
            display: grid;
            grid-template-columns: 2fr 1.2fr 1.2fr 120px;

            align-items: center;

            min-height: 72px;

            padding: 10px 18px;

            border-bottom: 1px solid #eaeef2;

            transition: background 0.15s ease;
        }

        .alumni-row:last-child {
            border-bottom: none;
        }

        .alumni-row:hover {
            background: #f6f8fa;
        }

        /* PERSON */

        .person {
            display: flex;
            align-items: center;

            gap: 12px;

            min-width: 0;
        }

        .avatar {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #eaeef2;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;
            font-weight: 600;

            color: #57606a;
        }

        .avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .person-info {
            min-width: 0;
        }

        .person-name {
            font-size: 14px;
            font-weight: 600;

            color: #24292f;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .person-email {
            font-size: 12px;

            color: #57606a;

            margin-top: 3px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .degree,
        .department {
            font-size: 13px;
            color: #57606a;
        }

        /* VIEW BUTTON */

        .view-btn {
            border: 1px solid #d0d7de;

            background: #ffffff;

            color: #0969da;

            border-radius: 6px;

            padding: 6px 11px;

            font-size: 12px;
            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .view-btn:hover {
            background: #f6f8fa;
            border-color: #0969da;
        }

        /* EMPTY / LOADING */

        .empty,
        .loading {
            padding: 50px 20px;

            text-align: center;

            color: #57606a;

            font-size: 14px;
        }

        /* PROFILE PREVIEW */

        .preview-overlay {
            position: fixed;

            inset: 0;

            background: rgba(27, 31, 36, 0.35);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 100;
        }

        .preview-overlay.active {
            display: flex;
        }

        .preview-box {
            width: 100%;

            max-width: 600px;

            max-height: 90vh;

            overflow-y: auto;

            background: #ffffff;

            border: 1px solid #d8dee4;

            border-radius: 8px;

            box-shadow:
                0 8px 24px rgba(140, 149, 159, 0.25);

            animation: popup 0.16s ease;
        }

        @keyframes popup {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .preview-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 16px 20px;

            border-bottom: 1px solid #d8dee4;
        }

        .preview-header-left {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .preview-back {
            border: none;

            background: transparent;

            font-size: 20px;

            cursor: pointer;

            color: #57606a;
        }

        .preview-back:hover {
            color: #24292f;
        }

        .preview-header h2 {
            font-size: 16px;

            font-weight: 600;
        }

        .close-btn {
            width: 30px;
            height: 30px;

            border: none;

            background: transparent;

            border-radius: 6px;

            cursor: pointer;

            font-size: 20px;

            color: #57606a;
        }

        .close-btn:hover {
            background: #f6f8fa;
        }

        .preview-content {
            padding: 26px;
        }

        /* PROFILE TOP */

        .profile-top {
            display: flex;

            align-items: center;

            gap: 16px;

            margin-bottom: 25px;
        }

        .large-avatar {
            width: 70px;
            height: 70px;

            flex-shrink: 0;

            border-radius: 50%;

            overflow: hidden;

            background: #eaeef2;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 22px;

            font-weight: 600;

            color: #57606a;
        }

        .large-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .profile-top h3 {
            font-size: 20px;

            font-weight: 600;

            color: #24292f;

            margin-bottom: 4px;
        }

        .profile-top p {
            font-size: 13px;

            color: #57606a;
        }

        /* PROFILE SECTION */

        .profile-section {
            margin-top: 20px;
        }

        .profile-section h4 {
            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 0.04em;

            color: #57606a;

            margin-bottom: 8px;
        }

        .profile-value {
            font-size: 14px;

            line-height: 1.6;

            color: #24292f;
        }

        /* PROFILE GRID */

        .profile-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;

            margin-top: 20px;
        }

        .profile-item {
            border: 1px solid #eaeef2;

            border-radius: 6px;

            padding: 12px;

            background: #f6f8fa;
        }

        .profile-item span {
            display: block;

            font-size: 11px;

            color: #57606a;

            margin-bottom: 4px;
        }

        .profile-item strong {
            font-size: 13px;

            font-weight: 500;

            color: #24292f;

            word-break: break-word;
        }

        /* PREVIEW FOOTER */

        .preview-footer {
            display: flex;

            justify-content: flex-end;

            gap: 8px;

            padding: 16px 20px;

            border-top: 1px solid #d8dee4;
        }

        .contact-btn {
            background: #24292f;

            color: #ffffff;

            border: 1px solid #24292f;

            border-radius: 6px;

            padding: 8px 16px;

            font-size: 13px;

            cursor: pointer;
        }

        .contact-btn:hover {
            background: #32383f;
        }

        .secondary-btn {
            background: #ffffff;

            color: #24292f;

            border: 1px solid #d0d7de;

            border-radius: 6px;

            padding: 8px 16px;

            font-size: 13px;

            cursor: pointer;
        }

        .secondary-btn:hover {
            background: #f6f8fa;
        }

        /* CONTACT POPUP */

        .contact-overlay {
            position: fixed;

            inset: 0;

            background: rgba(27, 31, 36, 0.4);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 200;
        }

        .contact-overlay.active {
            display: flex;
        }

        .contact-box {
            width: 100%;

            max-width: 450px;

            background: #ffffff;

            border: 1px solid #d8dee4;

            border-radius: 8px;

            box-shadow:
                0 8px 24px rgba(140, 149, 159, 0.3);
        }

        .contact-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            padding: 16px 20px;

            border-bottom: 1px solid #d8dee4;
        }

        .contact-header h3 {
            font-size: 16px;

            font-weight: 600;
        }

        .contact-body {
            padding: 20px;
        }

        .contact-body label {
            display: block;

            font-size: 12px;

            font-weight: 500;

            color: #57606a;

            margin-bottom: 6px;
        }

        .contact-body input,
        .contact-body textarea {
            width: 100%;

            border: 1px solid #d0d7de;

            border-radius: 6px;

            padding: 9px 10px;

            font-size: 13px;

            outline: none;

            margin-bottom: 15px;

            background: #ffffff;

            color: #24292f;
        }

        .contact-body input:focus,
        .contact-body textarea:focus {
            border-color: #0969da;

            box-shadow:
                0 0 0 2px rgba(9, 105, 218, 0.1);
        }

        .contact-body textarea {
            min-height: 120px;

            resize: vertical;
        }

        .contact-footer {
            display: flex;

            justify-content: flex-end;

            gap: 8px;

            padding: 15px 20px;

            border-top: 1px solid #d8dee4;
        }

        .send-btn {
            background: #0969da;

            color: #ffffff;

            border: 1px solid #0969da;

            border-radius: 6px;

            padding: 8px 16px;

            cursor: pointer;

            font-size: 13px;
        }

        .send-btn:hover {
            background: #0757b5;
        }

        /* AUTH ERROR */

        .auth-error {
            max-width: 600px;
            margin: 80px auto;
            padding: 24px;

            background: #ffffff;

            border: 1px solid #d8dee4;

            border-radius: 8px;

            text-align: center;
        }

        .auth-error h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .auth-error p {
            color: #57606a;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        /* RESPONSIVE */

        @media (max-width: 700px) {

            .main {
                padding: 24px 14px 40px;
            }

            .main-back-btn {
                margin-bottom: 20px;
            }

            .heading-row {
                align-items: stretch;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .list-header {
                display: none;
            }

            .alumni-row {
                grid-template-columns: 1fr auto;

                gap: 12px;

                padding: 14px;
            }

            .degree,
            .department {
                display: none;
            }

            .view-btn {
                grid-column: 2;
                grid-row: 1;
            }

            .person {
                grid-column: 1;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }

            .preview-content {
                padding: 20px;
            }

            .preview-footer {
                flex-direction: column-reverse;
            }

            .preview-footer button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="main" id="mainContent">

        <!-- Back to Dashboard -->

        <button
            class="main-back-btn"
            onclick="goDashboard()"
        >
            <span class="arrow">←</span>
            Back to Dashboard
        </button>

        <!-- Heading -->

        <div class="heading-row">

            <div class="heading">

                <h1>Alumni</h1>

                <p>
                    Explore alumni profiles and connect with them.
                </p>

            </div>

            <!-- Search -->

            <div class="search-box">

                <span>⌕</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search alumni..."
                    oninput="filterAlumni()"
                >

            </div>

        </div>

        <!-- Alumni list -->

        <section class="alumni-container" id="alumniContainer">

            <div class="list-header">

                <div>Alumni</div>

                <div>Degree</div>

                <div>Department</div>

                <div></div>

            </div>

            <div id="alumniList">

                <div class="loading">
                    Loading alumni...
                </div>

            </div>

        </section>

    </main>


    <!-- PROFILE PREVIEW -->

    <div
        class="preview-overlay"
        id="previewOverlay"
        onclick="closePreviewFromBackground(event)"
    >

        <div class="preview-box">

            <div class="preview-header">

                <div class="preview-header-left">

                    <button
                        class="preview-back"
                        onclick="closePreview()"
                        title="Back"
                    >
                        ←
                    </button>

                    <h2>Profile</h2>

                </div>

                <button
                    class="close-btn"
                    onclick="closePreview()"
                    title="Close"
                >
                    ×
                </button>

            </div>

            <div
                class="preview-content"
                id="previewContent"
            >
            </div>

            <div class="preview-footer">

                <button
                    class="secondary-btn"
                    onclick="closePreview()"
                >
                    Back
                </button>

                <button
                    class="contact-btn"
                    onclick="openContact()"
                >
                    Contact
                </button>

            </div>

        </div>

    </div>


    <!-- CONTACT POPUP -->

    <div
        class="contact-overlay"
        id="contactOverlay"
        onclick="closeContactFromBackground(event)"
    >

        <div class="contact-box">

            <div class="contact-header">

                <h3>
                    Contact
                    <span id="contactName">Alumni</span>
                </h3>

                <button
                    class="close-btn"
                    onclick="closeContact()"
                    title="Close"
                >
                    ×
                </button>

            </div>

            <div class="contact-body">

                <label for="contactSubject">
                    Subject
                </label>
                <input id="contactSubject" type="text" />

                <label for="contactMessage">
                    Message
                </label>
                <textarea id="contactMessage"></textarea>

            </div>

            <div class="contact-footer">
                <button class="secondary-btn" onclick="closeContact()">Cancel</button>
                <button class="send-btn" onclick="sendContact()">Send</button>
            </div>

        </div>

    </div>

    <script>
        // ---------- CONFIG ----------
        // If you already have a Supabase client created globally on your pages,
        // this script will try to use it. Otherwise set SUPABASE_URL and
        // SUPABASE_ANON_KEY below (or copy them from index.html).
        //
        // NOTE: If you want to preserve immediate redirect behaviour, set
        // REDIRECT_ON_NO_SESSION = true. Default below shows an inline message
        // and does NOT redirect so you can debug on GitHub Pages.
        const REDIRECT_ON_NO_SESSION = false; // change to true if you prefer redirect
        const SUPABASE_URL = 'https://kksarduvycfebklmhxfb.supabase.co'; // from your index.html
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtrc2FyZHV2eWNmZWJrbG1oeGZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMzU2MjQsImV4cCI6MjEwMTkxMTYyNH0.NlnHnEBqDX_sPJEK1evlYznhyWjTyANMn95QqrVARI0'; // replace with the full anon key from index.html

        // ---------- UTIL ----------
        function getById(id) { return document.getElementById(id); }
        function showAuthError(messageHtml) {
            const main = getById('mainContent');
            main.innerHTML = `
              <div class="auth-error">
                <h2>Sign in required</h2>
                <p>${messageHtml || 'You need to sign in to view alumni profiles.'}</p>
                <div style="margin-top: 12px;">
                  <a href="index.html">Go to Sign in</a>
                  <span style="margin-left:10px;color:#8c959f;font-size:13px;">or open this page with <code>?bypass=1</code> during development</span>
                </div>
              </div>
            `;
        }

        // ---------- PAGE LOGIC ----------
        (async function init() {
            // Allow bypass during development: ?bypass=1
            const params = new URLSearchParams(window.location.search);
            const bypass = params.get('bypass') === '1';

            // Prefer any existing global client (if you set it from index)
            let supabaseClient = window.supabaseClient || null;
            if (!supabaseClient) {
                // If user hasn't put anon key in this file, do not crash: show message
                if (SUPABASE_ANON_KEY === 'REPLACE_WITH_YOUR_ANON_KEY') {
                    console.warn('Supabase ANON KEY not set in alumni.html. If you want live data on this page, copy the anon key from index.html.');
                    // We continue without connecting; allow browsing the page content without auth if bypass is present
                    if (!bypass) {
                        // show friendly message but don't redirect (unless REDIRECT_ON_NO_SESSION true)
                        if (REDIRECT_ON_NO_SESSION) {
                            window.location.href = 'index.html';
                            return;
                        } else {
                            showAuthError('Supabase not configured on this page. To debug, add the ANON key or open with <code>?bypass=1</code>.');
                            return;
                        }
                    } else {
                        // bypass active — continue without supabase
                        loadDemoAlumni();
                        return;
                    }
                }

                try {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                } catch (err) {
                    console.error('Supabase init error:', err);
                    if (!bypass) {
                        if (REDIRECT_ON_NO_SESSION) {
                            window.location.href = 'index.html';
                        } else {
                            showAuthError('Failed to initialize Supabase client.');
                        }
                    } else {
                        loadDemoAlumni();
                    }
                    return;
                }
            }

            // Check session
            try {
                const { data } = await supabaseClient.auth.getSession();
                const session = data?.session ?? null;
                if (!session) {
                    // No user session found
                    if (!bypass) {
                        if (REDIRECT_ON_NO_SESSION) {
                            // redirect to sign-in (original behaviour)
                            window.location.href = 'index.html';
                            return;
                        } else {
                            // Show inline message instead of redirect so page stays open for debugging
                            showAuthError('You are not signed in. Please sign in to view alumni profiles.');
                            return;
                        }
                    } else {
                        // bypass — show demo content
                        loadDemoAlumni();
                        return;
                    }
                }

                // If session present, load alumni data from your table (example)
                await loadAlumni(supabaseClient);

            } catch (err) {
                console.error('Error checking session or loading alumni:', err);
                if (!bypass) {
                    if (REDIRECT_ON_NO_SESSION) {
                        window.location.href = 'index.html';
                        return;
                    } else {
                        showAuthError('An error occurred while validating session.');
                        return;
                    }
                } else {
                    loadDemoAlumni();
                    return;
                }
            }
        })();

        // ---------- DATA LOADING ----------
        async function loadAlumni(supabaseClient) {
            const alumniListEl = getById('alumniList');
            alumniListEl.innerHTML = `<div class="loading">Loading alumni...</div>`;

            try {
                // Adjust the table/columns below to match your schema
                const { data, error } = await supabaseClient
                    .from('alumni')
                    .select('id, full_name, email, degree, department, avatar_url')
                    .order('full_name', { ascending: true });

                if (error) {
                    console.error('Supabase query error:', error);
                    alumniListEl.innerHTML = `<div class="empty">Failed to load alumni. Check console for details.</div>`;
                    return;
                }

                if (!data || data.length === 0) {
                    alumniListEl.innerHTML = `<div class="empty">No alumni found.</div>`;
                    return;
                }

                alumniListEl.innerHTML = data.map(a => {
                    const initials = (a.full_name || 'U').split(' ').map(s => s[0]).slice(0,2).join('').toUpperCase();
                    const avatarHtml = a.avatar_url ? `<img src="${a.avatar_url}" alt="${a.full_name}">` : `<div class="avatar">${initials}</div>`;
                    return `
                        <div class="alumni-row" data-id="${a.id}">
                            <div class="person">
                                <div class="avatar">${a.avatar_url ? `<img src="${a.avatar_url}" alt="${a.full_name}">` : initials}</div>
                                <div class="person-info">
                                    <div class="person-name">${escapeHtml(a.full_name || '—')}</div>
                                    <div class="person-email">${escapeHtml(a.email || '—')}</div>
                                </div>
                            </div>
                            <div class="degree">${escapeHtml(a.degree || '—')}</div>
                            <div class="department">${escapeHtml(a.department || '—')}</div>
                            <div>
                                <button class="view-btn" onclick="openPreview('${a.id}')">View</button>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Error loading alumni:', err);
                const alumniListEl = getById('alumniList');
                alumniListEl.innerHTML = `<div class="empty">An unexpected error occurred while loading alumni.</div>`;
            }
        }

        // Demo content loader for bypass / debugging
        function loadDemoAlumni() {
            const alumniListEl = getById('alumniList');
            alumniListEl.innerHTML = `
                <div class="alumni-row">
                    <div class="person">
                        <div class="avatar">JD</div>
                        <div class="person-info">
                            <div class="person-name">John Doe</div>
                            <div class="person-email">john@example.com</div>
                        </div>
                    </div>
                    <div class="degree">B.Sc</div>
                    <div class="department">Computer Science</div>
                    <div><button class="view-btn" onclick="alert('Preview (demo)')">View</button></div>
                </div>
                <div class="alumni-row">
                    <div class="person">
                        <div class="avatar">AS</div>
                        <div class="person-info">
                            <div class="person-name">Alice Smith</div>
                            <div class="person-email">alice@example.com</div>
                        </div>
                    </div>
                    <div class="degree">M.Sc</div>
                    <div class="department">Mathematics</div>
                    <div><button class="view-btn" onclick="alert('Preview (demo)')">View</button></div>
                </div>
            `;
        }

        // ---------- SMALL HELPERS ----------
        function escapeHtml(s) {
            if (!s) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // preview stubs
        function openPreview(id) {
            alert('Open profile preview for id: ' + id);
        }

        function closePreview() {
            const overlay = getById('previewOverlay');
            overlay.classList.remove('active');
        }

        function closePreviewFromBackground(e) {
            if (e.target.id === 'previewOverlay') closePreview();
        }

        // contact stubs
        function openContact() {
            getById('contactOverlay').classList.add('active');
        }

        function closeContact() {
            getById('contactOverlay').classList.remove('active');
        }

        function closeContactFromBackground(e) {
            if (e.target.id === 'contactOverlay') closeContact();
        }

        function sendContact() {
            alert('Contact request sent (demo)');
            closeContact();
        }

        // simple navigation stub
        function goDashboard() {
            window.location.href = 'dashboard.html';
        }

        // filter stub (works against current DOM)
        function filterAlumni() {
            const q = (getById('searchInput').value || '').toLowerCase();
            const rows = document.querySelectorAll('#alumniList .alumni-row');
            rows.forEach(r => {
                const text = r.textContent.toLowerCase();
                r.style.display = text.includes(q) ? '' : 'none';
            });
        }
    </script>

</body>
</html>
