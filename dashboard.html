<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard • Student Guidance Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 24px; }
        .dashboard-box { background-color: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 24px; width: 100%; max-width: 450px; }
        h1 { font-size: 20px; color: #f0f6fc; margin-bottom: 12px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .logout-btn { background-color: #da3633; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 14px; font-weight: 500; padding: 8px 16px; width: 100%; }
        .logout-btn:hover { background-color: #b31d18; }
    </style>
</head>
<body>

    <div class="dashboard-box">
        <h1>Welcome to your Dashboard!</h1>
        <p id="userDetails">Loading your profile information...</p>
        <button onclick="handleLogout()" class="logout-btn">Sign out</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://kksarduvycfebklmhxfb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtrc2FyZHV2eWNmZWJrbG1oeGZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMzU2MjQsImV4cCI6MjEwMTkxMTYyNH0.NlnHnEBqDX_sPJEK1evlYznhyWjTyANMn95QqrVARI0';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadDashboard() {
            const userResponse = await supabaseClient.auth.getUser();
            const user = userResponse.data.user;

            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (error || !data || !data.account_type) {
                // If profile isn't filled yet, send them back to fill it out
                window.location.href = 'profile.html';
            } else {
                document.getElementById('userDetails').innerHTML = `
                    <strong>Name:</strong> ${data.full_name || 'N/A'}<br>
                    <strong>Role:</strong> ${data.account_type}<br>
                    <strong>Degree:</strong> ${data.degree || 'N/A'}<br>
                    <strong>Employment:</strong> ${data.current_employment || 'N/A'}<br>
                    <strong>Bio:</strong> ${data.bio || 'N/A'}
                `;
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        loadDashboard();
    </script>
</body>
</html>
